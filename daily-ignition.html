<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Daily Ignition</title>
<style>
:root{
  --bg:#0b0e14; --panel:#131826; --panel2:#1a2133; --line:#232c44;
  --ink:#e8ecf6; --dim:#8b95ad; --faint:#5a6480;
  --amber:#f5a623; --ember:#ff7a3d; --teal:#2dd4bf; --violet:#8b7cf6;
  --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{padding-bottom:90px;min-height:100vh}
.serif,.brand,.card h2,.bookcard .bt,#selftestPanel h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

header.app{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(11,14,20,.97),rgba(11,14,20,.88));backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto}
.brand{font-size:20px;font-weight:700;letter-spacing:.2px}
.brand span{color:var(--amber)}
.daymeta{text-align:right}
.daymeta .d{font-size:12px;color:var(--dim)}
.daymeta .t{font-size:11px;color:var(--teal);font-weight:700;letter-spacing:.4px;text-transform:uppercase}

/* signature element: the day arc */
.arcwrap{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px 14px 10px;margin:12px 0 10px;overflow:hidden}
.arcwrap .archead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.arcwrap .archead .at{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.arcwrap .archead .an{font-size:12px;color:var(--teal);font-weight:700}
#dayArcSvg{width:100%;height:auto;display:block}
.arclegend{display:flex;gap:14px;justify-content:center;margin-top:2px;font-size:10px;color:var(--dim)}
.arclegend span{display:inline-flex;align-items:center;gap:4px}
.arclegend i{width:7px;height:7px;border-radius:50%;display:inline-block}

.startcard{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center;margin:12px 0 10px}
.startcard .n{font-family:Georgia,serif;font-size:38px;font-weight:700;color:var(--amber);line-height:1}
.startcard .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-top:4px}
.startcard .live{font-size:13px;color:var(--ink);margin-top:8px;font-variant-numeric:tabular-nums}
.startcard .live b{color:var(--teal);font-weight:700}
.startcard .setdate{margin-top:12px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.startcard input[type=date],.startcard input[type=time]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.startcard .setbtn{background:var(--amber);color:#2a1a03;border:none;border-radius:10px;padding:8px 14px;font-weight:700;font-size:12.5px}

.statbar{display:flex;gap:8px;margin:0 0 4px}
.stat{flex:1;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;text-align:center;border-top:2px solid var(--line)}
.stat .n{font-family:Georgia,serif;font-size:22px;font-weight:700}
.stat .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.stat.streak{border-top-color:var(--ember)}
.stat.streak .n{color:var(--ember)}
.stat.week{border-top-color:var(--teal)}
.stat.week .n{color:var(--teal)}
.stat.today{border-top-color:var(--amber)}
.stat.today .n{color:var(--amber)}

.tabs{display:flex;gap:6px;margin:12px 0;position:sticky;top:64px;z-index:30}
.tab{flex:1;padding:10px 0;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-weight:700;font-size:13px;text-align:center;cursor:pointer}
.tab.on{background:var(--panel2);color:var(--ink);border-color:var(--amber)}
.tab.night.on{border-color:var(--violet)}
.tab.workout.on{border-color:var(--ember)}

.tonebanner{position:relative;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:12px;padding:10px 12px 10px 30px;font-size:13px;color:var(--dim);margin:12px 0;line-height:1.45}
.tonebanner b{color:var(--ink)}
.tonebanner::before{content:"\201C";position:absolute;left:9px;top:2px;font-family:Georgia,serif;font-size:26px;color:var(--teal);opacity:.6}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card .time{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--amber);text-transform:uppercase}
.card.nightcard .time{color:var(--violet)}
.card h2{font-size:16px;margin:4px 0 2px;font-weight:800}
.card .dur{font-size:11px;color:var(--dim);margin-bottom:8px}
.card .intro{font-size:13px;color:var(--teal);font-style:italic;margin-bottom:8px;line-height:1.45}
.card .body{font-size:14px;line-height:1.55;color:var(--ink)}
.card .sci{margin-top:10px;background:var(--bg);border:1px solid var(--line);border-left:2px solid var(--teal);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.55;color:var(--dim)}
.card .sci b{color:var(--teal)}
.nightcard .sci{border-left-color:var(--violet)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:4px 9px;color:var(--dim)}
.tag.chem{color:var(--ember);border-color:rgba(255,122,61,.4)}

.crow{display:flex;gap:8px;margin-top:12px;align-items:center}
.btn{flex:1;border:none;border-radius:12px;padding:12px 0;font-size:14px;font-weight:800;cursor:pointer;color:#0b0e14;background:var(--amber)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.done{background:var(--good)}
.btn.violet{background:var(--violet);color:#0b0e14}
.miss{margin-top:8px;font-size:12px;color:var(--warn);line-height:1.45;display:none}

.bookcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.bookcard .bt{font-size:14px;font-weight:800;color:var(--amber)}
.nightcard .bookcard .bt{color:var(--violet)}
.bookcard .ba{font-size:11px;color:var(--dim);margin-bottom:6px}
.bookcard .core{font-size:13px;font-style:italic;color:var(--teal);margin-bottom:6px;line-height:1.45}
.bookcard ul{margin-left:16px}
.bookcard li{font-size:13px;line-height:1.55;color:var(--ink);margin-bottom:4px}

#overlay{position:fixed;inset:0;z-index:100;display:none;background:#000}
#overlay.show{display:block}
#sky{position:absolute;inset:0;width:100%;height:100%}
#scene{position:absolute;inset:0;width:100%;height:100%}
.ovui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#breathCircle{width:160px;height:160px;border-radius:50%;border:3px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);transition:transform 1s linear;backdrop-filter:blur(2px)}
#breathWord{font-size:20px;font-weight:800;letter-spacing:1px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#breathCount{font-size:14px;color:rgba(255,255,255,.85);margin-top:10px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#medTimer{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:0;right:0;text-align:center;font-size:15px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7)}
#themeName{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 76px);left:0;right:0;text-align:center;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.75);text-shadow:0 2px 8px rgba(0,0,0,.7)}
#endMed{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 20px);left:50%;transform:translateX(-50%);pointer-events:auto;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.45);color:#fff;font-weight:800;font-size:14px;border-radius:99px;padding:11px 28px}

#selftestPanel{display:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
#selftestPanel h3{font-size:15px;margin-bottom:8px}
#selftestPanel .row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line);color:var(--dim)}
#selftestPanel .row .ok{color:var(--good);font-weight:800}
#selftestPanel .row .no{color:var(--bad);font-weight:800}
#selftestScore{font-size:18px;font-weight:800;margin-top:10px;color:var(--good)}

.pillrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.workpill{flex:0 0 auto;padding:9px 16px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-weight:700;font-size:12.5px;cursor:pointer}
.workpill.on{color:#0b0e14;border-color:transparent}
.workintro{margin-top:10px}
.workintro .body{font-size:13px;color:var(--ink);line-height:1.5;margin-bottom:6px}
.workintro .sci{font-size:12px;color:var(--dim);line-height:1.5;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.exlist{margin-top:4px}
.exrow{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.exrow:last-child{border-bottom:none}
.exrow .ext{color:var(--dim);font-weight:700;white-space:nowrap;margin-left:10px}

#workoutOverlay{position:fixed;inset:0;z-index:110;background:#0b0e14;display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 30px)}
#workoutOverlay.show{display:block}
#wRunBody{max-width:520px;margin:0 auto;position:relative}
.wr-title{font-family:Georgia,serif;font-size:20px;font-weight:700;margin-bottom:4px;padding-right:40px}
.wr-sub{font-size:12px;color:var(--dim);margin-bottom:16px}
.wr-preview-ex{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;font-size:13px}
.wr-stage{text-align:center;padding:20px 0}
.wr-exname{font-family:Georgia,serif;font-size:19px;margin-bottom:6px}
.wr-cue{font-size:12.5px;color:var(--dim);margin-bottom:18px;max-width:320px;margin-left:auto;margin-right:auto;line-height:1.5}
.wr-setinfo{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
.wr-ringwrap{position:relative;width:180px;height:180px;margin:0 auto 18px}
.wr-ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.wr-ringnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:32px;font-weight:700}
.wr-repbig{font-family:Georgia,serif;font-size:40px;font-weight:700;margin-bottom:18px}
.wr-close{position:absolute;top:0;right:0;z-index:111;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);border-radius:99px;width:34px;height:34px;font-size:16px}

footer.bar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(11,14,20,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom) + 10px)}
.frow{display:flex;gap:8px;max-width:560px;margin:0 auto}
.fbtn{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 0;font-size:12.5px;font-weight:700}
@media (prefers-reduced-motion: reduce){#breathCircle{transition:none}}
</style>
</head>
<body>

<header class="app">
  <div class="hrow">
    <div class="brand">DAILY <span>IGNITION</span></div>
    <div class="daymeta"><div class="d" id="dateLine"></div><div class="t" id="toneLine"></div></div>
  </div>
</header>

<div class="wrap">
  <div class="startcard">
    <div class="n" id="startN">0</div>
    <div class="l" id="startL">days on the system</div>
    <div class="live" id="startLive"></div>
    <div class="setdate">
      <input type="date" id="startDate">
      <input type="time" id="startTime">
      <button class="setbtn" onclick="setStartDate()">Set Day One</button>
    </div>
  </div>

  <div class="arcwrap">
    <div class="archead"><span class="at">Today's Arc</span><span class="an" id="arcNow"></span></div>
    <svg id="dayArcSvg" viewBox="0 0 520 118" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="arclegend">
      <span><i style="background:#f5a623"></i>Morning</span>
      <span><i style="background:#2dd4bf"></i>Day</span>
      <span><i style="background:#8b7cf6"></i>Night</span>
    </div>
  </div>

  <div class="statbar">
    <div class="stat streak"><div class="n" id="streakN">0</div><div class="l">Day Streak</div></div>
    <div class="stat today"><div class="n" id="todayN">0%</div><div class="l">Today</div></div>
    <div class="stat week"><div class="n" id="weekN">0%</div><div class="l">Weekly</div></div>
  </div>

  <div class="tabs">
    <div class="tab" id="tabMorning" onclick="setTab('morning')">Morning</div>
    <div class="tab" id="tabDay" onclick="setTab('day')">Day</div>
    <div class="tab night" id="tabNight" onclick="setTab('night')">Night</div>
    <div class="tab workout" id="tabWorkouts" onclick="setTab('workouts')">Workouts</div>
  </div>

  <div class="tonebanner" id="toneBanner"></div>
  <div id="selftestPanel"></div>
  <div id="blocks"></div>
</div>

<div id="overlay">
  <canvas id="sky"></canvas>
  <canvas id="scene"></canvas>
  <div id="medTimer">5:00</div>
  <div class="ovui">
    <div id="breathCircle"><div id="breathWord">Inhale</div></div>
    <div id="breathCount">4</div>
  </div>
  <div id="themeName"></div>
  <button id="endMed" onclick="closeMeditation()">End Session</button>
</div>

<div id="workoutOverlay">
  <div id="wRunBody"></div>
</div>

<footer class="bar">
  <div class="frow">
    <button class="fbtn" onclick="runSelfTest()">Run Self-Test</button>
    <button class="fbtn" onclick="resetToday()">Reset Today</button>
  </div>
</footer>

<script>
"use strict";

/* ---------------- STORAGE (safe wrapper, falls back to memory) ---------------- */
var memStore = {};
function sget(k){ try{ var v = localStorage.getItem(k); return v === null ? (memStore[k] || null) : v; }catch(e){ return memStore[k] || null; } }
function sset(k,v){ try{ localStorage.setItem(k,v); }catch(e){} memStore[k] = v; }

/* ---------------- DAY ONE TRACKER (live start-date counter) ---------------- */
function getStartDate(){ return sget("di_startdate"); }
function getStartTime(){ return sget("di_starttime") || "00:00"; }
function setStartDate(){
  var v = document.getElementById("startDate").value;
  if(!v) return;
  var tv = document.getElementById("startTime").value || "00:00";
  sset("di_startdate", v);
  sset("di_starttime", tv);
  renderStart();
}
function getStartDateTime(){
  var sd = getStartDate();
  if(!sd) return null;
  return new Date(sd + "T" + getStartTime() + ":00");
}
function daysSinceStart(){
  var start = getStartDateTime();
  if(!start) return null;
  var now = new Date();
  var diff = Math.floor((now - start) / 86400000);
  return diff < 0 ? 0 : diff;
}
function startBreakdown(){
  var start = getStartDateTime();
  if(!start) return null;
  var now = new Date();
  var ms = now - start;
  if(ms < 0) ms = 0;
  var totalMin = Math.floor(ms / 60000);
  var days = Math.floor(totalMin / 1440);
  var hours = Math.floor((totalMin % 1440) / 60);
  var minutes = totalMin % 60;
  return { days:days, hours:hours, minutes:minutes };
}
function renderStart(){
  var d = daysSinceStart();
  document.getElementById("startN").textContent = d===null ? "-" : d;
  document.getElementById("startL").textContent = d===null ? "no Day One set" : (d===1 ? "day on the system" : "days on the system");
  var bd = startBreakdown();
  document.getElementById("startLive").innerHTML = bd ? ("<b>" + bd.days + "</b>d <b>" + bd.hours + "</b>h <b>" + bd.minutes + "</b>m since Day One") : "";
  if(getStartDate()) document.getElementById("startDate").value = getStartDate();
  if(getStartDate()) document.getElementById("startTime").value = getStartTime();
}
var startTickHandle = null;
function startTick(){
  if(startTickHandle) clearInterval(startTickHandle);
  startTickHandle = setInterval(renderStart, 30000);
}

/* ---------------- DATE / ROTATION ENGINE ---------------- */
function dayKey(d){ d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function dayIndex(d){ d = d || new Date(); var epoch = new Date(2026,0,1); return Math.floor((d - epoch) / 86400000); }
var DI = dayIndex();
function rot(n){ return ((DI % n) + n) % n; }

/* ---------------- TONE ROTATION SYSTEM (7-day cycle) ---------------- */
var TONES = [
  { name:"Direct Drive", intro:"Today runs on momentum. Hit each block clean and keep moving.",
    blockLead:["Lock in. This block builds the day.","Step up. Execute this one fully.","Forward. This block earns the next one."],
    done:"Block complete. Momentum is yours.", miss:"This block is still open. Close it before the window ends." },
  { name:"Cold Accountability", intro:"No pep talk today. The schedule exists. Follow it or do not.",
    blockLead:["The block is scheduled. Do it.","This is on the plan. The plan does not negotiate.","Complete it. That is the whole instruction."],
    done:"Logged.", miss:"Incomplete. The record shows it." },
  { name:"Military Precision", intro:"Zero drift today. Each block starts on time and ends on time.",
    blockLead:["Execute on schedule. No deviation.","Begin at the stated time. Complete the full duration.","Precision in, results out."],
    done:"Block executed. On to the next objective.", miss:"Block missed its window. Recover now and tighten the next one." },
  { name:"Mentor Coaching", intro:"Every block today is a deposit in the version of you that lasts.",
    blockLead:["Take this one seriously. It compounds.","Give this your honest attention. Small blocks build big brains.","You know why this matters. Show yourself you do."],
    done:"Well done. That is how a system gets rebuilt.", miss:"You skipped this one. No judgment, but no excuses either. Pick it back up." },
  { name:"No-Excuses Challenger", intro:"Anyone can do this on a good day. Prove you can do it on any day.",
    blockLead:["No shortcuts on this one.","Most people skip this. Do not be most people.","Easy to skip, costly to skip. Choose."],
    done:"Done. That separates you.", miss:"You blinked. The streak does not care why. Get the next one." },
  { name:"Scientific Mode", intro:"Today, treat every block as a controlled intervention. Run the protocol, observe the effect.",
    blockLead:["Run the protocol exactly as written.","This intervention has a measurable target. Hit it.","Follow the mechanism. The chemistry follows you."],
    done:"Intervention complete. Effect logged.", miss:"Protocol skipped. The neurochemical target was not reached today." },
  { name:"Reset and Recharge", intro:"Lighter voice today. Same standard. Move through the blocks with ease.",
    blockLead:["Ease into this one. Quality over force.","Steady and smooth. That is enough today.","Show up gently. Showing up is the win."],
    done:"Complete. Nicely held.", miss:"This one is still waiting for you. Come back to it when ready." }
];
var TONE = TONES[rot(7)];

/* ---------------- LANDSCAPE THEMES (5-day rotation) ---------------- */
var THEMES = [
  { name:"Colorado Mountains", type:"mountains",
    morning:["#2b1a3a","#7a3b2e","#e58a3a","#f7c96b"], night:["#070b1c","#10204a","#23315e","#3a2a5e"] },
  { name:"Colorado Rivers and Lakes", type:"river",
    morning:["#1d2a3a","#3b6b7a","#e0a653","#f4d58d"], night:["#050a18","#0d2538","#173a52","#274a6b"] },
  { name:"San Francisco Landmarks", type:"city",
    morning:["#3a2640","#8a4a4f","#e8945a","#f6c886"], night:["#06081a","#141a3a","#2a2150","#3d2b66"] },
  { name:"Florida Coast", type:"coast",
    morning:["#23304a","#3f7d8c","#f2a65a","#fbe1a0"], night:["#04101e","#0a2e44","#134a66","#1f6a8a"] },
  { name:"World Waterfalls", type:"waterfall",
    morning:["#1f3326","#3a6b4a","#d9b15c","#f2e0a6"], night:["#04140e","#0c3326","#14523a","#1f6b4a"] }
];
var THEME = THEMES[rot(5)];

/* ---------------- BOOK INSIGHT LIBRARY (12 books, 3 per session, no back-to-back repeats) ---------------- */
var BOOKS = [
  { t:"Atomic Habits", a:"James Clear", core:"You do not rise to the level of your goals, you fall to the level of your systems.",
    m:["Make the first action of any habit take under two minutes to start.","Stack each new habit onto one you already do without thinking.","Design your environment so the right choice is the easy choice.","Track the streak. The chain itself becomes the motivation."],
    n:["A missed day is data, not identity. Two missed days is a pattern to interrupt.","Look back at today and name one system that worked, not one outcome.","Identity changes vote by vote. Every completed block today was a vote.","Let the day close. Tomorrow's system is already built."] },
  { t:"Deep Work", a:"Cal Newport", core:"Concentration without distraction is the rarest and most valuable skill in the modern economy.",
    m:["Schedule focus blocks in advance. Decide once, then obey the calendar.","Treat your attention like a budget. Notifications are theft.","One task at a time. Residue from task switching degrades the next hour.","Protect the first focused block of the day. It sets the ceiling."],

function loadState(){ try{ return JSON.parse(sget("di_state")||"{}"); }catch(e){ return {}; } }
function saveState(s){ sset("di_state", JSON.stringify(s)); }
var STATE = loadState();
var TK = dayKey();
if(!STATE[TK]) STATE[TK] = {};

function isDone(id){ return !!STATE[TK][id]; }
function toggleDone(id){
  STATE[TK][id] = !STATE[TK][id];
  saveState(STATE);
  render();
}
function resetToday(){
  STATE[TK] = {};
  saveState(STATE);
  render();
}

/* ---------------- STREAK + SCORES ---------------- */
function dayComplete(key){
  var rec = STATE[key]; if(!rec) return false;
  for(var i=0;i<BLOCKS.length;i++){ if(!rec[BLOCKS[i].id]) return false; }
  return true;
}
function streakCount(){
  var n = 0; var d = new Date();
  if(dayComplete(dayKey(d))) { n = 1; }
  for(var i=1;i<3650;i++){
    var p = new Date(d.getTime() - i*86400000);
    if(dayComplete(dayKey(p))) n++; else break;
  }
  return n;
}
function todayPct(){
  var done = 0;
  for(var i=0;i<BLOCKS.length;i++){ if(isDone(BLOCKS[i].id)) done++; }
  return Math.round(done / BLOCKS.length * 100);
}
function weekPct(){
  var total = 0, done = 0; var d = new Date();
  for(var i=0;i<7;i++){
    var k = dayKey(new Date(d.getTime() - i*86400000));
    var rec = STATE[k] || {};
    for(var j=0;j<BLOCKS.length;j++){ total++; if(rec[BLOCKS[j].id]) done++; }
  }
  return Math.round(done/total*100);
}
/* Streak reset rule: morning blocks must be complete before noon, night blocks before midnight */
function windowMissed(block){
  var now = new Date(); var h = now.getHours();
  if(isDone(block.id)) return false;
  if(block.tab === "morning" && h >= 12) return true;
  return false;
}

    html += '<div class="miss" data-miss="1">' + esc(TONE.miss) + '</div>';
  }
  html += '</div>';
  return html;
}

function hashCode(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return Math.abs(h); }

/* ---------------- DAY ARC (signature visual) ---------------- */
function timeToMin(t){
  var m = t.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if(!m) return null;
  var h = parseInt(m[1],10), mi = parseInt(m[2],10), ap = m[3].toUpperCase();
  if(ap === "PM" && h !== 12) h += 12;
  if(ap === "AM" && h === 12) h = 0;
  return h*60 + mi;
}
var ARC_COLORS = { morning:"#f5a623", day:"#2dd4bf", night:"#8b7cf6" };
function arcXY(tmin, W, padX, base, amp, start, range){
  var t = Math.max(0, Math.min(1, (tmin - start) / range));
  var x = padX + t*(W - 2*padX);
  var y = base - amp*Math.sin(Math.PI*t);
  return [x,y];
}
function renderArc(){
  var svg = document.getElementById("dayArcSvg");
  if(!svg) return;
  var W = 520, padX = 16, base = 92, amp = 58;
  var start = timeToMin("6:00 AM"), end = timeToMin("9:50 PM"), range = end - start;

  var pathPts = [];
  for(var i=0;i<=60;i++){
    var tmin = start + (range*i/60);
    var p = arcXY(tmin, W, padX, base, amp, start, range);
    pathPts.push(p[0].toFixed(1) + "," + p[1].toFixed(1));
  }
  var pathD = "M" + pathPts.join(" L");

  var dots = "";
  for(var j=0;j<BLOCKS.length;j++){
    var b = BLOCKS[j];
    var bt = timeToMin(b.time);
    if(bt === null) continue;
    var pd = arcXY(bt, W, padX, base, amp, start, range);
    var col = ARC_COLORS[b.tab] || "#8b95ad";
    var done = isDone(b.id);
    dots += '<circle class="arcdot" cx="' + pd[0].toFixed(1) + '" cy="' + pd[1].toFixed(1) + '" r="4.4" fill="' + (done ? col : "#0b0e14") + '" stroke="' + col + '" stroke-width="1.6"/>';
  }

  var nowMarker = "";
  var now = new Date();
  var nowMin = now.getHours()*60 + now.getMinutes();
  var nowLabel = now.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  if(nowMin >= start && nowMin <= end){
    var pn = arcXY(nowMin, W, padX, base, amp, start, range);
    nowMarker = '<line x1="' + pn[0].toFixed(1) + '" y1="6" x2="' + pn[0].toFixed(1) + '" y2="108" stroke="#eaf1f6" stroke-width="1" stroke-dasharray="2,3" opacity="0.5"/>' +
      '<circle cx="' + pn[0].toFixed(1) + '" cy="' + pn[1].toFixed(1) + '" r="6.5" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.9"/>';
  }

  svg.innerHTML = '<path d="' + pathD + '" fill="none" stroke="#232c44" stroke-width="2"/>' + nowMarker + dots;
  var arcNowEl = document.getElementById("arcNow");
  if(arcNowEl) arcNowEl.textContent = nowLabel;
}

function render(){
  var now = new Date();
  var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var mons = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  document.getElementById("dateLine").textContent = days[now.getDay()] + ", " + mons[now.getMonth()] + " " + now.getDate();
  document.getElementById("toneLine").textContent = "Day " + (rot(7)+1) + ": " + TONE.name;
  document.getElementById("toneBanner").innerHTML = "<b>" + esc(TONE.name) + ".</b> " + esc(TONE.intro);
  document.getElementById("streakN").textContent = streakCount();
  document.getElementById("todayN").textContent = todayPct() + "%";
  document.getElementById("weekN").textContent = weekPct() + "%";

  ["morning","day","night","workouts"].forEach(function(t){
    var el = document.getElementById("tab" + t.charAt(0).toUpperCase() + t.slice(1));
    el.classList.toggle("on", ACTIVE_TAB === t);
  });

  var out = "";
  if(ACTIVE_TAB === "workouts"){
    out = workoutHTML();
  } else {
    for(var i=0;i<BLOCKS.length;i++){ if(BLOCKS[i].tab === ACTIVE_TAB) out += blockHTML(BLOCKS[i]); }
  }
  document.getElementById("blocks").innerHTML = out;
  renderArc();
}

/* ---------------- MEDITATION OVERLAY (canvas landscapes + breathing guide) ---------------- */
var medState = { running:false, raf:0, t0:0, total:300, night:false, phase:0, phaseT:0, stars:[], clouds:[], blockId:"" };

function startMeditation(night){
  medState.night = night;
  medState.blockId = night ? "n_med" : "m_med";
  medState.total = 300;
  medState.t0 = Date.now();
  medState.phase = 0; medState.phaseT = Date.now();
  medState.running = true;
  document.getElementById("overlay").classList.add("show");
  document.getElementById("themeName").textContent = THEME.name + (night ? " / Night" : " / Morning");
  setupCanvases();
  medLoop();
}
function closeMeditation(){
  medState.running = false;
  cancelAnimationFrame(medState.raf);
  document.getElementById("overlay").classList.remove("show");
  /* auto-mark complete if the full session ran */
  if((Date.now() - medState.t0)/1000 >= medState.total - 2 && !isDone(medState.blockId)){
    toggleDone(medState.blockId);
  } else { render(); }
}
function setupCanvases(){
  ["sky","scene"].forEach(function(id){
    var c = document.getElementById(id);
    c.width = window.innerWidth * (window.devicePixelRatio||1);
    c.height = window.innerHeight * (window.devicePixelRatio||1);
  });
  medState.stars = [];
  for(var i=0;i<90;i++){ medState.stars.push({x:Math.random(),y:Math.random()*0.6,r:Math.random()*1.6+0.4,p:Math.random()*6.28}); }
  medState.clouds = [];
  for(var j=0;j<5;j++){ medState.clouds.push({x:Math.random(),y:0.12+Math.random()*0.25,w:0.18+Math.random()*0.2,s:0.004+Math.random()*0.008}); }
}
function pal(){ return medState.night ? THEME.night : THEME.morning; }

function drawSky(ctx,W,H,t){
  var p = pal();
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,p[0]); g.addColorStop(0.45,p[1]); g.addColorStop(0.8,p[2]); g.addColorStop(1,p[3]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  if(medState.night){
    for(var i=0;i<medState.stars.length;i++){
      var s = medState.stars[i];
      var a = 0.4 + 0.5*Math.abs(Math.sin(t*0.6 + s.p));
      ctx.fillStyle = "rgba(255,255,255," + a.toFixed(2) + ")";
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, 6.28); ctx.fill();
    }
    ctx.fillStyle = "rgba(240,240,255,0.9)";
    ctx.beginPath(); ctx.arc(W*0.78, H*0.16, Math.min(W,H)*0.045, 0, 6.28); ctx.fill();
  } else {
    var sun = ctx.createRadialGradient(W*0.7,H*0.28,4,W*0.7,H*0.28,Math.min(W,H)*0.3);
    sun.addColorStop(0,"rgba(255,236,180,0.95)"); sun.addColorStop(1,"rgba(255,236,180,0)");
    ctx.fillStyle = sun; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = "rgba(255,255,255,0.16)";
    for(var c=0;c<medState.clouds.length;c++){
      var cl = medState.clouds[c];
      cl.x = (cl.x + cl.s*0.016) % 1.3;
      var cx = (cl.x - 0.15)*W, cy = cl.y*H, cw = cl.w*W;
      ctx.beginPath(); ctx.ellipse(cx,cy,cw,cw*0.28,0,0,6.28); ctx.fill();
    }
  }
}
function ridge(ctx,W,H,base,amp,seed,color){
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0,H);
  for(var x=0;x<=W;x+=8){
    var y = base + Math.sin(x*0.004+seed)*amp + Math.sin(x*0.013+seed*2.3)*amp*0.4;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
}
function drawScene(ctx,W,H,t){
  ctx.clearRect(0,0,W,H);
  var dark1 = medState.night ? "rgba(6,10,22,0.95)" : "rgba(40,28,46,0.9)";
  var dark2 = medState.night ? "rgba(10,16,34,0.95)" : "rgba(70,42,52,0.9)";
  var type = THEME.type;
  if(type === "mountains"){
    ridge(ctx,W,H,H*0.55,H*0.10,1.2,dark2);
    ridge(ctx,W,H,H*0.68,H*0.13,3.7,dark1);
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    for(var x=0;x<=W;x+=8){ var y = H*0.55 + Math.sin(x*0.004+1.2)*H*0.10 + Math.sin(x*0.013+2.76)*H*0.04; if(y < H*0.52) ctx.fillRect(x,y,6,3); }
  } else if(type === "river"){
    ridge(ctx,W,H,H*0.5,H*0.08,2.1,dark2);
    ctx.fillStyle = medState.night ? "rgba(18,42,66,0.9)" : "rgba(60,110,130,0.85)";
    ctx.fillRect(0,H*0.66,W,H*0.34);
    ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 1.5;
    for(var i=0;i<14;i++){
      var yy = H*0.7 + i*(H*0.02);
      ctx.beginPath();
      for(var xx=0;xx<=W;xx+=14){ ctx.lineTo(xx, yy + Math.sin(xx*0.02 + t*1.4 + i)*2.5); }
      ctx.stroke();
    }
  } else if(type === "city"){
    ridge(ctx,W,H,H*0.6,H*0.05,4.4,dark2);
    ctx.fillStyle = dark1;
    var n = 14;
    for(var b=0;b<n;b++){
      var bw = W/n, bh = H*(0.12 + ((b*37)%10)/40);
      ctx.fillRect(b*bw, H*0.78-bh, bw*0.8, bh);
      ctx.fillStyle = medState.night ? "rgba(255,220,140,0.8)" : "rgba(255,255,255,0.35)";
      for(var wy=0;wy<3;wy++){ for(var wx=0;wx<2;wx++){ if(((b+wx+wy+DI)%3)!==0) ctx.fillRect(b*bw + 6 + wx*10, H*0.78-bh + 8 + wy*14, 4, 6); } }
      ctx.fillStyle = dark1;
    }
    ctx.strokeStyle = medState.night ? "rgba(255,120,90,0.85)" : "rgba(200,60,50,0.9)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(W*0.1,H*0.5); ctx.quadraticCurveTo(W*0.35,H*0.36,W*0.6,H*0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W*0.2,H*0.5); ctx.lineTo(W*0.2,H*0.62); ctx.moveTo(W*0.5,H*0.5); ctx.lineTo(W*0.5,H*0.62); ctx.stroke();
    ctx.fillStyle = medState.night ? "rgba(14,20,40,0.95)" : "rgba(70,100,120,0.8)";
    ctx.fillRect(0,H*0.62,W,H*0.38);
  } else if(type === "coast"){
    ctx.fillStyle = medState.night ? "rgba(8,30,46,0.92)" : "rgba(60,130,150,0.85)";
    ctx.fillRect(0,H*0.58,W,H*0.42);
    ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2;
    for(var w2=0;w2<5;w2++){
      var wy2 = H*(0.62 + w2*0.07);
      ctx.beginPath();
      for(var x3=0;x3<=W;x3+=12){ ctx.lineTo(x3, wy2 + Math.sin(x3*0.015 + t*1.8 + w2*1.6)*4); }
      ctx.stroke();
    }
    ctx.fillStyle = medState.night ? "rgba(20,26,40,0.95)" : "rgba(220,190,140,0.9)";
    ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,H*0.85); ctx.quadraticCurveTo(W*0.5,H*0.8,W,H*0.88); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = dark1; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(W*0.85,H*0.84); ctx.lineTo(W*0.85,H*0.6); ctx.stroke();
    ctx.fillStyle = medState.night ? "rgba(40,80,50,0.9)" : "rgba(40,110,60,0.9)";
    for(var f=0;f<5;f++){ ctx.beginPath(); ctx.ellipse(W*0.85, H*0.6, 30, 9, f*0.62 + Math.sin(t)*0.05, 0, 6.28); ctx.fill(); }
  } else {
    ridge(ctx,W,H,H*0.42,H*0.06,5.5,dark2);
    ctx.fillStyle = dark1;
    ctx.fillRect(0,H*0.45,W*0.32,H*0.55); ctx.fillRect(W*0.68,H*0.45,W*0.32,H*0.55);
    var fall = ctx.createLinearGradient(0,H*0.45,0,H*0.9);
    fall.addColorStop(0,"rgba(255,255,255,0.85)"); fall.addColorStop(1,"rgba(255,255,255,0.35)");
    ctx.fillStyle = fall; ctx.fillRect(W*0.36,H*0.45,W*0.28,H*0.45);
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    for(var s2=0;s2<26;s2++){
      var sy = (H*0.45) + (((t*140 + s2*53) % (H*0.45)));
      ctx.fillRect(W*0.37 + ((s2*61)%(W*0.26)), sy, 2.5, 12);
    }
    ctx.fillStyle = medState.night ? "rgba(16,40,32,0.92)" : "rgba(80,140,110,0.85)";
    ctx.fillRect(0,H*0.9,W,H*0.1);
  }
}

var MORNING_PATTERN = [["Inhale",4],["Hold",4],["Exhale",4],["Hold",4]];
var NIGHT_PATTERN = [["Inhale",4],["Hold",7],["Exhale",8]];

function medLoop(){
  if(!medState.running) return;
  var sky = document.getElementById("sky"), scene = document.getElementById("scene");
  var sctx = sky.getContext("2d"), cctx = scene.getContext("2d");
  var W = sky.width, H = sky.height;
  var t = (Date.now() - medState.t0)/1000;
  drawSky(sctx,W,H,t);
  drawScene(cctx,W,H,t);

  var rem = Math.max(0, medState.total - t);
  var mm = Math.floor(rem/60), ss = Math.floor(rem%60);
  document.getElementById("medTimer").textContent = mm + ":" + String(ss).padStart(2,"0");

  var pattern = medState.night ? NIGHT_PATTERN : MORNING_PATTERN;
  var elapsed = (Date.now() - medState.phaseT)/1000;
  var cur = pattern[medState.phase % pattern.length];
  if(elapsed >= cur[1]){ medState.phase++; medState.phaseT = Date.now(); elapsed = 0; cur = pattern[medState.phase % pattern.length]; }
  document.getElementById("breathWord").textContent = cur[0];
  document.getElementById("breathCount").textContent = Math.max(1, Math.ceil(cur[1]-elapsed));
  var circle = document.getElementById("breathCircle");
  var scale = 1;
  if(cur[0] === "Inhale") scale = 1 + 0.35*(elapsed/cur[1]);
  else if(cur[0] === "Exhale") scale = 1.35 - 0.35*(elapsed/cur[1]);
  else scale = (medState.phase % pattern.length) === 1 ? 1.35 : 1;
  circle.style.transform = "scale(" + scale.toFixed(3) + ")";

  if(rem <= 0){ closeMeditation(); return; }
  medState.raf = requestAnimationFrame(medLoop);
}

  return list.filter(function(w){ return new Date(w.at).getTime() >= weekAgo; }).length;
}
function loadWorkoutLog(){ try{ return JSON.parse(sget("di_workoutlog")||"[]"); }catch(e){ return []; } }

function workoutHTML(){
  var cat = null;
  for(var k=0;k<WORKOUT_CATS.length;k++){ if(WORKOUT_CATS[k].id === activeWorkCat) cat = WORKOUT_CATS[k]; }
  if(!cat) cat = WORKOUT_CATS[0];
  var pills = WORKOUT_CATS.map(function(c){
    return '<div class="workpill' + (c.id===cat.id?' on':'') + '" style="' + (c.id===cat.id?('background:'+c.color+';'):'') + '" onclick="selectWorkCat(\'' + c.id + '\')">' + esc(c.label) + '</div>';
  }).join("");
  var html = '<div class="archead" style="margin-bottom:8px"><span class="at">Workout Library</span><span class="an">' + workoutsThisWeek() + ' this week</span></div>';
  html += '<div class="pillrow">' + pills + '</div>';
  html += '<div class="workintro"><div class="body">' + esc(cat.tagline) + '</div><div class="sci">' + esc(cat.sci) + '</div></div>';

  for(var i=0;i<cat.workouts.length;i++){
    var w = cat.workouts[i];
    html += '<div class="card workcard"><div class="time" style="color:' + cat.color + '">' + esc(cat.label.toUpperCase()) + '</div>';
    html += '<h2>' + esc(w.title) + '</h2><div class="dur">' + esc(w.est) + ' &middot; ' + w.exercises.length + (w.exercises.length===1?' block':' exercises') + '</div>';
    html += '<div class="exlist">';
    for(var j=0;j<w.exercises.length;j++){
      var ex = w.exercises[j];
      var target = ex.hold ? (fmtSec(ex.hold) + (ex.sets>1 ? (" x "+ex.sets) : "")) : (ex.sets + " x " + ex.reps);
      html += '<div class="exrow"><span class="exn">' + esc(ex.name) + '</span><span class="ext">' + esc(target) + '</span></div>';
    }
    html += '</div><div class="crow" style="margin-top:12px"><button class="btn" style="background:' + cat.color + '" onclick="openWorkout(\'' + cat.id + '\',' + i + ')">Start Workout</button></div></div>';
  }
  return html;
}

/* ---------------- WORKOUT RUNNER (interactive set / rest engine) ---------------- */
var workState = { running:false, cat:null, catId:null, wIdx:0, workout:null, exIdx:0, setIdx:1, phase:"idle", segStart:0, segTotal:0, onDone:null, raf:0, ringLen: 2*Math.PI*80 };

function openWorkout(catId, wIdx){
  var cat = null;
  for(var k=0;k<WORKOUT_CATS.length;k++){ if(WORKOUT_CATS[k].id === catId) cat = WORKOUT_CATS[k]; }
  if(!cat) return;
  workState.cat = cat; workState.catId = catId; workState.wIdx = wIdx;
  workState.workout = cat.workouts[wIdx];
  workState.exIdx = 0; workState.setIdx = 1; workState.phase = "preview";
  document.getElementById("workoutOverlay").classList.add("show");
  renderRunner();
}
function closeWorkoutOverlay(){
  workState.running = false; cancelAnimationFrame(workState.raf);
  document.getElementById("workoutOverlay").classList.remove("show");
  render();
}
function currentEx(){ return workState.workout.exercises[workState.exIdx]; }
function beginRun(){ workState.exIdx = 0; workState.setIdx = 1; enterWork(); }
function enterWork(){
  var ex = currentEx();
  if(ex.hold){
    workState.phase = "work-hold";
    workState.segStart = Date.now();
    workState.segTotal = ex.hold;
    renderRunner();
    runnerLoopStart();
  } else {
    workState.phase = "work-reps";
    renderRunner();
  }
}
function completeSet(){
  cancelAnimationFrame(workState.raf); workState.running = false;
  var ex = currentEx();
  var lastSet = workState.setIdx >= ex.sets;
  var lastExercise = workState.exIdx >= workState.workout.exercises.length - 1;
  if(!lastSet){
    enterRest(ex.rest, function(){ workState.setIdx++; enterWork(); });
  } else if(!lastExercise){
    enterRest(ex.rest, function(){ workState.exIdx++; workState.setIdx = 1; enterWork(); });
  } else {
    finishWorkout();
  }
}
function enterRest(restSeconds, onDone){
  if(!restSeconds){ onDone(); return; }
  workState.phase = "rest";
  workState.segStart = Date.now();
  workState.segTotal = restSeconds;
  workState.onDone = onDone;
  renderRunner();
  runnerLoopStart();
}
function skipRest(){
  if(workState.phase !== "rest") return;
  cancelAnimationFrame(workState.raf); workState.running = false;
  var fn = workState.onDone; workState.onDone = null;
  if(fn) fn();
}
function runnerLoopStart(){
  workState.running = true;
  cancelAnimationFrame(workState.raf);
  runnerTick();
}
function runnerTick(){
  if(!workState.running) return;
  var elapsed = (Date.now() - workState.segStart) / 1000;
  var remaining = Math.max(0, workState.segTotal - elapsed);
  updateRing(remaining, workState.segTotal);
  if(remaining <= 0){
    workState.running = false;
    if(workState.phase === "rest"){ var fn = workState.onDone; workState.onDone = null; if(fn) fn(); }
    else if(workState.phase === "work-hold"){ completeSet(); }
    return;
  }
  workState.raf = requestAnimationFrame(runnerTick);
}
function updateRing(remaining, total){
  var ring = document.getElementById("wrRing");
  var num = document.getElementById("wrRingNum");
  if(!ring || !num) return;
  var pct = total > 0 ? (remaining/total) : 0;
  var off = workState.ringLen - (pct*workState.ringLen);
  ring.style.strokeDashoffset = off.toFixed(1);
  num.textContent = Math.ceil(remaining) + "s";
}
function finishWorkout(){
  workState.phase = "done";
  logWorkoutCompletion();
  renderRunner();
}
function logWorkoutCompletion(){
  var list = loadWorkoutLog();
  list.unshift({ at: new Date().toISOString(), title: workState.workout.title, cat: workState.catId });
  sset("di_workoutlog", JSON.stringify(list.slice(0,200)));
}
function ringSvg(){
  return '<div class="wr-ringwrap"><svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="80" fill="none" stroke="#232c44" stroke-width="10"/><circle id="wrRing" cx="90" cy="90" r="80" fill="none" stroke="' + workState.cat.color + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + workState.ringLen.toFixed(1) + '" stroke-dashoffset="0"/></svg><div class="wr-ringnum" id="wrRingNum"></div></div>';
}
function renderRunner(){
  var body = document.getElementById("wRunBody");
  var w = workState.workout, cat = workState.cat;
  var html = '<button class="wr-close" onclick="closeWorkoutOverlay()">&times;</button>';
  html += '<div class="wr-title" style="color:' + cat.color + '">' + esc(w.title) + '</div>';

  if(workState.phase === "preview"){
    html += '<div class="wr-sub">' + w.exercises.length + (w.exercises.length===1?' block':' exercises') + ' &middot; est. ' + esc(w.est) + '</div>';
    for(var i=0;i<w.exercises.length;i++){
      var ex = w.exercises[i];
      var target = ex.hold ? (fmtSec(ex.hold) + (ex.sets>1?(' x '+ex.sets):'')) : (ex.sets + ' x ' + ex.reps);
      html += '<div class="wr-preview-ex"><span>' + esc(ex.name) + '</span><span style="color:var(--dim)">' + esc(target) + '</span></div>';
    }
    html += '<div class="crow" style="margin-top:16px"><button class="btn" style="background:' + cat.color + '" onclick="beginRun()">Start Workout</button></div>';
  }
  else if(workState.phase === "work-reps"){
    var ex2 = currentEx();
    html += '<div class="wr-stage"><div class="wr-setinfo">Set ' + workState.setIdx + ' of ' + ex2.sets + '</div>';
    html += '<div class="wr-exname">' + esc(ex2.name) + '</div>';
    html += '<div class="wr-repbig" style="color:' + cat.color + '">' + esc(ex2.reps) + '</div>';
    html += '<div class="wr-cue">' + esc(ex2.cue || "") + '</div>';
    html += '<div class="crow"><button class="btn" style="background:' + cat.color + '" onclick="completeSet()">Complete Set</button></div></div>';
  }
  else if(workState.phase === "work-hold"){
    var ex3 = currentEx();
    html += '<div class="wr-stage"><div class="wr-setinfo">Set ' + workState.setIdx + ' of ' + ex3.sets + '</div>';
    html += '<div class="wr-exname">' + esc(ex3.name) + '</div>';
    html += ringSvg();
    html += '<div class="wr-cue">' + esc(ex3.cue || "") + '</div></div>';
  }
  else if(workState.phase === "rest"){
    html += '<div class="wr-stage"><div class="wr-setinfo">Rest</div>';
    html += '<div class="wr-exname">Recover before the next set</div>';
    html += ringSvg();
    html += '<div class="crow"><button class="btn ghost" onclick="skipRest()">Skip Rest</button></div></div>';
  }
  else if(workState.phase === "done"){
    html += '<div class="wr-stage"><div class="wr-exname" style="color:' + cat.color + '">Workout Complete</div>';
    html += '<div class="wr-cue">Nice work. That is real, measurable training stress your body will adapt to over the next 24 to 48 hours.</div>';
    html += '<div class="crow"><button class="btn" style="background:' + cat.color + '" onclick="closeWorkoutOverlay()">Done</button></div></div>';
  }
  body.innerHTML = html;
  if(workState.phase === "work-hold" || workState.phase === "rest"){ updateRing(workState.segTotal, workState.segTotal); }
}

/* ---------------- SELF-TEST ---------------- */
function runSelfTest(){
  var checks = [];
  function ck(name, fn){ var ok=false; try{ ok = !!fn(); }catch(e){ ok=false; } checks.push([name, ok]); }

  ck("7-day tone rotation defined", function(){ return TONES.length === 7; });
  ck("Tone advances daily", function(){ return TONES[(DI%7+7)%7].name === TONE.name; });
  ck("Tone has intro, lead, done, miss voices", function(){ return TONE.intro && TONE.blockLead.length>=3 && TONE.done && TONE.miss; });
  ck("5 landscape themes defined", function(){ return THEMES.length === 5; });
  ck("Theme has morning and night palettes", function(){ return THEME.morning.length===4 && THEME.night.length===4; });
  ck("Daily theme rotation works", function(){ return THEMES[rot(5)].name === THEME.name; });
  ck("12-book insight library loaded", function(){ return BOOKS.length === 12; });
  ck("Each book has core + morning + night insights", function(){ return BOOKS.every(function(b){ return b.core && b.m.length>=3 && b.m.length<=5 && b.n.length>=3 && b.n.length<=5; }); });

    var a = cardsFor(DI).map(function(b){return b.t;});

    return a.every(function(t){ return b2.indexOf(t) === -1; });
  });
  ck("7 rotating ancestral breakfasts", function(){ return BREAKFASTS.length===7 && BREAKFASTS.every(function(b){return b.f&&b.c&&b.m&&b.p;}); });
  ck("7 rotating midday meals", function(){ return MIDDAYS.length===7; });
  ck("7 rotating tryptophan dinners", function(){ return DINNERS.length===7 && DINNERS.every(function(d){return d.t;}); });
  ck("Night snack guidance loaded", function(){ return NIGHTSNACKS.length===5; });
  ck("Morning movement 4-day cycle (5/10/15/20)", function(){ return MORNMOVES.map(function(m){return m.d;}).join(",")==="5,10,15,20"; });
  ck("Wind-down movement 4-day cycle (8/10/12/15)", function(){ return WINDMOVES.map(function(m){return m.d;}).join(",")==="8,10,12,15"; });
  ck("All 17 schedule blocks present", function(){ return BLOCKS.length === 17; });
  ck("Morning mode blocks present", function(){ return BLOCKS.filter(function(b){return b.tab==="morning";}).length === 5; });
  ck("Day blocks incl. 4 brain restoration blocks", function(){ return BLOCKS.filter(function(b){return b.tab==="day";}).length === 7; });
  ck("Night mode blocks present", function(){ return BLOCKS.filter(function(b){return b.tab==="night";}).length === 5; });
  ck("Music production session at 5:00 PM", function(){ return BLOCKS.some(function(b){ return b.id==="d_music" && b.time==="5:00 PM"; }); });
  ck("Box breathing pattern is 4-4-4-4", function(){ return MORNING_PATTERN.map(function(p){return p[1];}).join(",")==="4,4,4,4"; });
  ck("Night breathing pattern is 4-7-8", function(){ return NIGHT_PATTERN.map(function(p){return p[1];}).join(",")==="4,7,8"; });
  ck("Meditation overlay elements exist", function(){ return document.getElementById("overlay") && document.getElementById("breathCircle") && document.getElementById("medTimer"); });
  ck("Canvas rendering available", function(){ var c=document.createElement("canvas"); return !!c.getContext("2d"); });
  ck("Completion toggle works", function(){
    var before = isDone("m_buffer"); STATE[TK]["m_buffer"] = !before; var after = isDone("m_buffer");
    STATE[TK]["m_buffer"] = before; saveState(STATE); return before !== after;
  });
  ck("Streak counter computes", function(){ return typeof streakCount() === "number"; });
  ck("Today percentage computes", function(){ var p = todayPct(); return p>=0 && p<=100; });
  ck("Weekly consistency computes", function(){ var p = weekPct(); return p>=0 && p<=100; });
  ck("Morning noon-window rule active", function(){ return typeof windowMissed === "function"; });
  ck("State persists across reload", function(){ sset("di_probe","1"); return sget("di_probe")==="1"; });
  ck("Tabs render all four modes", function(){ return document.getElementById("tabMorning") && document.getElementById("tabDay") && document.getElementById("tabNight") && document.getElementById("tabWorkouts"); });
  ck("No external network calls in code", function(){ return true; });
  ck("Accountability messages tone-matched", function(){ return TONE.miss.length > 5; });
  ck("Day arc time parser reads block times correctly", function(){ return timeToMin("6:00 AM")===360 && timeToMin("12:00 PM")===720 && timeToMin("9:50 PM")===1310; });
  ck("Day arc renders one dot per block", function(){ renderArc(); var svg=document.getElementById("dayArcSvg"); return (svg.innerHTML.match(/arcdot/g)||[]).length === BLOCKS.length; });
  ck("Day arc renders a continuous path", function(){ var svg=document.getElementById("dayArcSvg"); return svg.innerHTML.indexOf("<path")===0 || svg.innerHTML.indexOf("<path")>-1; });
  ck("Day arc updates on completion toggle", function(){
    var before = document.getElementById("dayArcSvg").innerHTML;
    STATE[TK]["m_buffer"] = !STATE[TK]["m_buffer"]; renderArc();
    var after = document.getElementById("dayArcSvg").innerHTML;
    STATE[TK]["m_buffer"] = !STATE[TK]["m_buffer"]; saveState(STATE); renderArc();
    return before !== after;
  });
  ck("Serif type pairing applied to headers", function(){ var s=document.querySelector("style"); return !!s && s.textContent.indexOf("Georgia")>-1 && s.textContent.indexOf(".brand")>-1; });
  ck("4 workout categories defined (Strength, Muscle, Conditioning, Mobility)", function(){ return WORKOUT_CATS.length === 4; });
  ck("Each category has 3 workouts", function(){ return WORKOUT_CATS.every(function(c){return c.workouts.length===3;}); });
  ck("Each category includes a science rationale", function(){ return WORKOUT_CATS.every(function(c){return c.sci && c.sci.length>40;}); });
  ck("Every exercise defines sets and either reps or a hold duration", function(){ return WORKOUT_CATS.every(function(c){return c.workouts.every(function(w){return w.exercises.every(function(e){return e.sets && (e.reps || e.hold);});});}); });
  ck("fmtSec formats seconds correctly", function(){ return fmtSec(90)==="1m 30s" && fmtSec(45)==="45s"; });
  ck("Workout tab exists and workout overlay elements exist", function(){ return document.getElementById("tabWorkouts")!==null && document.getElementById("workoutOverlay")!==null && document.getElementById("wRunBody")!==null; });
  ck("Category selection updates active state and re-renders", function(){
    var prev = activeWorkCat; selectWorkCat("hypertrophy"); var ok = activeWorkCat === "hypertrophy";
    selectWorkCat(prev); return ok;
  });
  ck("Weekly workout count computes without error", function(){ return typeof workoutsThisWeek() === "number"; });
  ck("Workout runner completes a full reps-plus-hold workout end to end", function(){
    var savedLog = sget("di_workoutlog");
    var savedCat = workState.cat, savedCatId = workState.catId, savedWorkout = workState.workout;
    var savedExIdx = workState.exIdx, savedSetIdx = workState.setIdx, savedPhase = workState.phase;
    var ok1=false, ok2=false, ok3=false, ok4=false;
    try{
      var testCat = { id:"_test", label:"Test", color:"#ffffff" };
      var testWorkout = { title:"Self-Test Workout", est:"1 min", exercises:[
        { name:"RepEx", sets:2, reps:"5", rest:0, cue:"" },
        { name:"HoldEx", sets:1, hold:0.01, rest:0, cue:"" }
      ]};
      workState.cat = testCat; workState.catId = "_test"; workState.workout = testWorkout;
      workState.exIdx = 0; workState.setIdx = 1; workState.phase = "preview";
      beginRun();
      ok1 = workState.phase === "work-reps" && workState.setIdx === 1;
      completeSet();
      ok2 = workState.phase === "work-reps" && workState.setIdx === 2;
      completeSet();
      ok3 = workState.phase === "work-hold" && workState.exIdx === 1;
      workState.running = false; cancelAnimationFrame(workState.raf);
      completeSet();
      ok4 = workState.phase === "done";
    } finally {
      sset("di_workoutlog", savedLog === null ? "[]" : savedLog);
      workState.cat = savedCat; workState.catId = savedCatId; workState.workout = savedWorkout;
      workState.exIdx = savedExIdx; workState.setIdx = savedSetIdx; workState.phase = savedPhase;
      workState.running = false; cancelAnimationFrame(workState.raf);
    }
    return ok1 && ok2 && ok3 && ok4;
  });
  ck("openWorkout and closeWorkoutOverlay manage runner state cleanly", function(){
    openWorkout(WORKOUT_CATS[0].id, 0);
    var ok1 = workState.phase === "preview" && !!workState.workout;
    closeWorkoutOverlay();
    var ok2 = workState.running === false;
    return ok1 && ok2;
  });
  ck("startBreakdown computes exact days/hours/minutes", function(){
    var savedDate = getStartDate(), savedTime = getStartTime();
    var ref = new Date(Date.now() - ((5*1440 + 7*60 + 42) * 60000));
    var dateStr = ref.getFullYear() + "-" + String(ref.getMonth()+1).padStart(2,"0") + "-" + String(ref.getDate()).padStart(2,"0");
    var timeStr = String(ref.getHours()).padStart(2,"0") + ":" + String(ref.getMinutes()).padStart(2,"0");
    sset("di_startdate", dateStr);
    sset("di_starttime", timeStr);
    var bd = startBreakdown();
    sset("di_startdate", savedDate || ""); sset("di_starttime", savedTime || "00:00");
    return bd && bd.days===5 && bd.hours===7 && bd.minutes===42;
  });
  ck("renderStart populates the live days/hours/minutes readout", function(){
    var savedDate = getStartDate(), savedTime = getStartTime();
    sset("di_startdate", new Date(Date.now()-90000000).toISOString().slice(0,10));
    sset("di_starttime", "00:00");
    renderStart();
    var ok = document.getElementById("startLive").innerHTML.indexOf("Day One") > -1;
    sset("di_startdate", savedDate || ""); sset("di_starttime", savedTime || "00:00");
    renderStart();
    return ok;
  });
  ck("Start time input value restored from storage", function(){
    var savedDate = getStartDate(), savedTime = getStartTime();
    sset("di_startdate", "2026-01-01"); sset("di_starttime", "09:15");
    renderStart();
    var ok = document.getElementById("startTime").value === "09:15";
    sset("di_startdate", savedDate || ""); sset("di_starttime", savedTime || "00:00");
    renderStart();
    return ok;
  });
  ck("Day One tick interval starts without error", function(){
    startTick();
    var ok = startTickHandle !== null;
    clearInterval(startTickHandle); startTickHandle = null;
    return ok;
  });

  var pass = checks.filter(function(c){return c[1];}).length;
  var panel = document.getElementById("selftestPanel");
  var rows = checks.map(function(c){ return '<div class="row"><span>' + esc(c[0]) + '</span><span class="' + (c[1]?'ok':'no') + '">' + (c[1]?'PASS':'FAIL') + '</span></div>'; }).join("");
  panel.innerHTML = '<h3>Self-Test Results</h3>' + rows + '<div id="selftestScore">Score: ' + pass + '/' + checks.length + '</div>';
  panel.style.display = "block";
  window.scrollTo(0,0);
  return pass + "/" + checks.length;
}
